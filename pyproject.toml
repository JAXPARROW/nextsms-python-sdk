[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextsms-python-sdk"
version = "0.1.0"
description = "Enterprise-ready Python SDK for the NextSMS API (Tanzania)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jackson Linus", email = "jacksonlinus95@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["nextsms", "sms", "tanzania", "africa", "messaging", "bulk-sms"]
dependencies = [
    "requests>=2.25.0",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/JAXPARROW/nextsms-python-sdk"
Repository = "https://github.com/JAXPARROW/nextsms-python-sdk.git"
Issues = "https://github.com/JAXPARROW/nextsms-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nextsms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
